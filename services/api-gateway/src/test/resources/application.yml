spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    discovery:
      client:
        simple:
          instances:
            customer-service:
              - uri: http://localhost:12345
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
